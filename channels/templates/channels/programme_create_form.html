{% extends "base.html" %}

{% block title %}Add Programme{% endblock title %}

{% block content %}
<h1 class="mb-4">Add a New Programme</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save Programme</button>
    <a href="{% url 'channel_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock content %}
