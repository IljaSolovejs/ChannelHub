{% extends "base.html" %}

{% block title %}Add Channel{% endblock title %}

{% block content %}
<h1 class="mb-4">Add a New Channel</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save Channel</button>
    <a href="{% url 'channel_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock content %}
