{% extends "base.html" %}

{% block title %}Delete Channel{% endblock title %}

{% block content %}
<h1 class="mb-4">Delete Channel</h1>
<form method="post">
    {% csrf_token %}
    <p>Are you sure you want to delete "{{ channel.name }}"?</p>
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'channel_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock content %}
