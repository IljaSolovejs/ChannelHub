{% extends "base.html" %}

{% block title %}Edit Channel{% endblock title %}

{% block content %}
<h1 class="mb-4">Edit Channel</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{% url 'channel_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock content %}
